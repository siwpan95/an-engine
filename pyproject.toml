[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "allin-engine"
version = "1.0.0"
description = "统一游戏引擎 — 融合 ECS、事件总线、世界模型与卡牌战斗的通用 Python 游戏引擎"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "全哥"}
]
keywords = ["game-engine", "ecs", "roguelike", "trpg", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# ---- 核心依赖 (无) ----
# 引擎核心零硬依赖，所有外部库均为可选
dependencies = []

# ---- 可选依赖组 ----
[project.optional-dependencies]
# 渲染增强：公式引擎(asteval) + 数学加速(numpy)
render = [
    "numpy>=1.24",
    "asteval>=1.0",
]

# 音频合成：波形生成 + 信号处理 + 播放
audio = [
    "numpy>=1.24",
    "scipy>=1.10",
]

# pygame 完整功能（含音频播放 + 输入 + 字体渲染）
pygame = [
    "pygame-ce>=2.4",
]

# AI 内容生成：本地 ollama 或云端 DeepSeek
ai = [
    "requests>=2.28",
]

# 一键安装所有可选依赖
all = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pygame-ce>=2.4",
    "requests>=2.28",
    "asteval>=1.0",
]

[project.urls]
Homepage = "https://gitee.com/siwpan/an-engine"
Repository = "https://gitee.com/siwpan/an-engine"
Issues = "https://gitee.com/siwpan/an-engine/issues"

[project.scripts]
allin-test = "allin_engine.test.run_all:main"
# TRPG 规则界面壳（2026-10-20 自 siwpan/d20 并入，原仓确诊冗余后删除）
allin-trpg = "allin_engine.trpg.cli:main"
allin-trpg-gui = "allin_engine.trpg.gui:main"

[tool.setuptools]
# 关闭「自动收录被 git 跟踪的包内文件」。pyproject 模式下该开关默认为 True，
# 会绕过 exclude-package-data 把包目录下所有已跟踪文件打进去（字体正是如此，
# 一度让 wheel 从 ~40KB 膨胀到 27MB）。本包只需 .py 源码。
include-package-data = false

[tool.setuptools.packages.find]
# alloy 是**向后兼容别名包**（引擎旧名 → allin_engine）。见 alloy/__init__.py：
# 下游 siwpan/d20 的 shim 全部按旧名 `alloy.trpg.*` 导入，改名后失效；
# 在引擎侧补一个别名包 = 改 1 处，下游零改动。
include = ["allin_engine*", "alloy*"]

# 双保险：即便将来恢复 include-package-data，字体也不进包。
# 字体按需自备，见 README「字体」一节：
#   放到 <用户数据目录>/allin_engine/fonts/   （Windows: %APPDATA%\allin_engine\fonts）
#   或用环境变量 ALLIN_FONT_PATH（单个字体）/ ALLIN_FONTS_DIR（字体目录）指定
[tool.setuptools.exclude-package-data]
allin_engine = ["fonts/*"]
alloy = ["*"]

# media 子系统的配方数据（4980 个 .json，约 3MB）是引擎运行必需的一部分，
# 因上面关掉了 include-package-data 而不会自动收录，故在此显式声明。
[tool.setuptools.package-data]
allin_engine = [
    "media/*.json",
    "media/*/*.json",
    "media/*/*/*.json",
    "media/*/*/*/*.json",
    "media/*.md",
    # TRPG 黄金样例验收基线（自 siwpan/d20 并入）
    "trpg/samples/*.txt",
]
