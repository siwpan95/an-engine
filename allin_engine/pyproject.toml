[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "allin-engine"
version = "1.0.0"
description = "统一游戏引擎 — 从 D:\\allin 下多项目提炼的通用 Python 游戏引擎"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "全哥"}
]
keywords = ["game-engine", "ecs", "roguelike", "python"]

# ---- 核心依赖 (无) ----
# 引擎核心零硬依赖，所有外部库均为可选
dependencies = []

# ---- 可选依赖组 ----
[project.optional-dependencies]
# 渲染增强：公式引擎(asteval) + 数学加速(numpy)
render = [
    "numpy>=1.24",
    "asteval>=1.0",
]

# 音频合成：波形生成 + 信号处理 + 播放
audio = [
    "numpy>=1.24",
    "scipy>=1.10",
]

# pygame 完整功能（含音频播放 + 输入 + 字体渲染）
pygame = [
    "pygame-ce>=2.4",
]

# AI 内容生成：本地 ollama 或云端 DeepSeek
ai = [
    "requests>=2.28",
]

# 一键安装所有可选依赖
all = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pygame-ce>=2.4",
    "requests>=2.28",
    "asteval>=1.0",
]

[project.urls]
Homepage = "https://github.com/quan/allin_engine"
Issues = "https://github.com/quan/allin_engine/issues"

[project.scripts]
allin-test = "allin_engine.test.run_all:main"

[tool.setuptools.packages.find]
include = ["allin_engine*"]

# 随包分发的本地字体（fonts/ 目录下的字体文件）
[tool.setuptools.package-data]
allin_engine = ["fonts/*"]
